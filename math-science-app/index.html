<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover：iPad 全螢幕時避開瀏海／圓角；maximum-scale 保留 5 倍，不剝奪放大權利 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<title>🚀 星際數學探險</title>
<link rel="stylesheet" href="g5-styles-20260807.css">
</head>
<!--
  星際數學探險　主入口
  2026-08-09

  結構：年級（1-6）→ 學期（上／下）→ 單元地圖 → 課程
  每個年級都有上下兩學期，即使還沒做也先列出來，讓小孩知道整個範圍在哪裡。

  舊版的「四下互動闖關」沒有刪除，改名保留成 index-g4b-20260807.html，
  在四年級下學期的位置可以進去。
-->
<body>
<div class="wrap">

  <div class="hero">
    <h1>🚀 星際數學探險</h1>
    <p>引導式教學 · 先把概念弄懂，再練題目</p>
  </div>

  <!-- 第一層：年級 -->
  <section class="card" id="grade-card">
    <h2>你幾年級？</h2>
    <p class="sub">選好年級之後再選上學期或下學期</p>
    <div class="grade-row" id="grade-row"></div>
  </section>

  <!-- 第二層：學期 -->
  <section class="card" id="term-card" hidden>
    <h2 id="term-title">選擇學期</h2>
    <p class="sub" id="term-sub"></p>
    <div class="term-row" id="term-row"></div>
  </section>

  <!-- 第三層：單元地圖 -->
  <section class="card" id="unit-card" hidden>
    <h2 id="unit-card-title"></h2>
    <p class="sub" id="unit-card-sub"></p>
    <div class="unit-list" id="unit-list"></div>
  </section>

  <!-- 家長入口：主畫面 App 沒有網址列，沒有站內連結就進不去報告頁 -->
  <p class="parent-link" id="parent-link" hidden>
    <a href="g5-tutor-report-20260808.html">家長：看「問老師」使用紀錄</a>
  </p>

  <!-- 課程 -->
  <section class="card" id="lesson-card" hidden>
    <button class="back-link" id="back-btn" type="button">← 回單元地圖</button>
    <div id="lesson-root"></div>
  </section>

</div>

<script src="g5-lesson-engine-20260807.js"></script>
<script src="g5-tutor-content-20260808.js"></script>
<script src="g5-tutor-content-part2-20260808.js"></script>
<script src="g5-unit01-linechart-20260807.js"></script>
<script src="g5-unit02-factors-20260807.js"></script>
<script src="g5-unit03-plane-20260808.js"></script>
<script src="g5-unit04-common-20260807.js"></script>
<script src="g5-unit05-solids-20260808.js"></script>
<script src="g5-unit06-operations-20260807.js"></script>
<script src="g5-unit07-fractions-20260807.js"></script>
<script src="g5-unit08-area-20260808.js"></script>
<script src="g5-unit09-multiply-20260807.js"></script>
<script src="g5-unit10-sector-20260808.js"></script>
<script>
'use strict';
(function () {
  const { El, LessonEngine } = window.G5;

  /**
   * 課程總表：年級 → 學期。
   * 每個年級固定兩個學期，即使還沒做也要列出來——
   * 小孩看得到整個範圍，才知道自己現在在哪裡、接下來要學什麼。
   *
   * 每個學期可以是三種狀態之一：
   *   units    這學期的單元清單（id 為 null 代表該單元還沒做）
   *   external 連到另一個獨立的頁面（例如舊版的四下闖關）
   *   （都沒有）代表還沒開始做
   */
  const CURRICULUM = {
    5: {
      '上': {
        note: '翰林版 · 10 個單元。點單元開始學習，進度會自動記住。',
        units: [
          { order: 1,  title: '折線圖',         icon: '📈', id: 'g5-u01-linechart' },
          { order: 2,  title: '倍數與因數',     icon: '🔢', id: 'g5-u02-factors' },
          { order: 3,  title: '平面圖形',       icon: '📐', id: 'g5-u03-plane' },
          { order: 4,  title: '公倍數與公因數', icon: '🔗', id: 'g5-u04-common' },
          { order: 5,  title: '立體形體',       icon: '🧊', id: 'g5-u05-solids' },
          { order: 6,  title: '四則運算',       icon: '➗', id: 'g5-u06-operations' },
          { order: 7,  title: '擴分約分與加減', icon: '🍰', id: 'g5-u07-fractions' },
          { order: 8,  title: '面積',           icon: '🟩', id: 'g5-u08-area' },
          { order: 9,  title: '乘以幾分之一',   icon: '✖️', id: 'g5-u09-multiply' },
          { order: 10, title: '扇形',           icon: '🌗', id: 'g5-u10-sector' },
        ],
      },
      '下': {},
    },
    4: {
      '上': {},
      '下': {
        external: 'index-g4b-20260807.html',
        externalLabel: '四下互動闖關（舊版，含時間換算）',
      },
    },
    1: { '上': {}, '下': {} },
    2: { '上': {}, '下': {} },
    3: { '上': {}, '下': {} },
    6: { '上': {}, '下': {} },
  };

  const $ = (id) => document.getElementById(id);
  const gradeCard = $('grade-card'), termCard = $('term-card'),
        unitCard = $('unit-card'), lessonCard = $('lesson-card'),
        lessonRoot = $('lesson-root'), unitList = $('unit-list'),
        parentLink = $('parent-link');

  let curGrade = null, curTerm = null;

  const hasContent = (g, t) => {
    const s = CURRICULUM[g]?.[t];
    if (!s) return false;
    if (s.external) return true;
    return Boolean(s.units && s.units.some((u) => u.id && window.G5_UNITS?.[u.id]));
  };
  const gradeReady = (g) => hasContent(g, '上') || hasContent(g, '下');

  /* ── 第一層：年級 ── */
  const gradeRow = $('grade-row');
  for (let g = 1; g <= 6; g++) {
    const ready = gradeReady(g);
    const btn = El('button', {
      class: 'grade-btn', type: 'button', disabled: ready ? null : 'disabled',
    }, `${g} 年級`, El('small', {}, ready ? '可用' : '準備中'));
    if (ready) btn.addEventListener('click', () => pickGrade(g, btn));
    gradeRow.append(btn);
  }

  function pickGrade(g, btn) {
    curGrade = g;
    gradeRow.querySelectorAll('.grade-btn').forEach((b) => b.classList.remove('is-active'));
    btn.classList.add('is-active');
    renderTerms();
    termCard.hidden = false;
    unitCard.hidden = true;
    parentLink.hidden = true;
    termCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ── 第二層：學期 ── */
  function renderTerms() {
    $('term-title').textContent = `${curGrade} 年級　選擇學期`;
    $('term-sub').textContent = '一個學年分成上下兩個學期，先選你現在要學的那一個';
    const row = $('term-row');
    row.replaceChildren();
    ['上', '下'].forEach((t) => {
      const ready = hasContent(curGrade, t);
      const sem = CURRICULUM[curGrade][t] || {};
      const count = sem.units ? sem.units.filter((u) => u.id && window.G5_UNITS?.[u.id]).length : 0;
      const desc = sem.external ? '舊版闖關頁面'
        : ready ? `${count} 個單元可用`
        : '製作中';
      const btn = El('button', {
        class: 'term-btn', type: 'button', disabled: ready ? null : 'disabled',
      }, `${t}學期`, El('small', {}, desc));
      if (ready) btn.addEventListener('click', () => pickTerm(t, btn));
      row.append(btn);
    });
  }

  function pickTerm(t, btn) {
    const sem = CURRICULUM[curGrade][t];
    if (sem.external) { window.location.href = sem.external; return; }
    curTerm = t;
    $('term-row').querySelectorAll('.term-btn').forEach((b) => b.classList.remove('is-active'));
    btn.classList.add('is-active');
    renderUnits();
    unitCard.hidden = false;
    parentLink.hidden = false;
    unitCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ── 第三層：單元地圖 ── */
  function renderUnits() {
    const sem = CURRICULUM[curGrade][curTerm];
    $('unit-card-title').textContent = `${curGrade} 年級${curTerm}學期 · 數學`;
    $('unit-card-sub').textContent = sem.note || '';
    unitList.replaceChildren();
    (sem.units || []).forEach((u) => {
      const ready = Boolean(u.id && window.G5_UNITS?.[u.id]);
      const done = ready && localStorage.getItem(`g5-progress-${u.id}-done`) === '1';
      const card = El('button', {
        class: 'unit ' + (ready ? 'is-ready' : 'is-locked') + (done ? ' is-done' : ''),
        type: 'button', disabled: ready ? null : 'disabled',
      },
        El('span', { class: 'icon' }, u.icon),
        El('span', { class: 'meta' },
          El('strong', {}, `${u.order}. ${u.title}`),
          El('span', {}, ready
            ? `${window.G5_UNITS[u.id].estimatedMinutes} 分鐘 · ${window.G5_UNITS[u.id].subtitle}`
            : '製作中')),
        El('span', { class: 'tag' }, done ? '已完成' : (ready ? '可開始' : '製作中')));
      if (ready) card.addEventListener('click', () => openUnit(u.id));
      unitList.append(card);
    });
  }

  /* ── 課程 ── */
  function openUnit(id) {
    const unit = window.G5_UNITS[id];
    gradeCard.hidden = true; termCard.hidden = true;
    unitCard.hidden = true; parentLink.hidden = true;
    lessonCard.hidden = false;

    lessonRoot.replaceChildren(El('div', { class: 'lesson-intro' },
      El('h2', { class: 'lesson-title' }, `${unit.icon} ${unit.title}`),
      El('p', { class: 'lesson-text' }, unit.subtitle),
      El('h3', { style: 'margin:18px 0 10px;font-size:1.15rem;' }, '學完這個單元，你會：'),
      El('ul', { class: 'objectives' }, unit.objectives.map((o) => El('li', {}, o))),
      El('div', { class: 'lesson-nav' },
        El('button', {
          class: 'btn btn--primary', type: 'button',
          onClick: () => { lessonRoot.replaceChildren(); new LessonEngine(unit, lessonRoot).start(); },
        }, '開始學習 →'))));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function backToMap() {
    lessonCard.hidden = true;
    gradeCard.hidden = false; termCard.hidden = false;
    unitCard.hidden = false; parentLink.hidden = false;
    renderUnits();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  $('back-btn').addEventListener('click', backToMap);
  window.addEventListener('lesson:exit', backToMap);
})();
</script>
</body>
</html>
